services:
  redis:
    image: redis:7-alpine
    container_name: gamehive-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: gamehive-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gamehive
      POSTGRES_USER: ${POSTGRES_USER:-gamehive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gamehive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.53
    container_name: gamehive-meilisearch
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${GAMEHIVE_IMAGE:-ghcr.io/minner22/gamehive-backend:master}
    container_name: gamehive-app
    profiles: [app]
    ports:
      - "${GAMEHIVE_PORT:-8080}:8080"   # port hosta do zmiany, gdy 8080 zajmuje aplikacja z IDE
    env_file: .env                  # JWT_*, MAIL_*, MEILI_MASTER_KEY, REDIS_PASSWORD — te same nazwy co lokalnie
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/gamehive
      DB_USER: ${POSTGRES_USER:-gamehive}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      MEILI_HOST: http://meilisearch:7700
      ACTIVATION_ADDRESS: http://localhost:5173/activate
      PASSWORD_RESET_ADDRESS: http://localhost:5173/password-reset/confirm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  redis-data:
  postgres-data:
  meili-data:
