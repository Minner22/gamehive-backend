# Uruchomienie z profilem: -Dspring.profiles.active=prod
# Domyślnie aktywny profil dev (lokalny development)
spring:
    profiles:
        active: dev
    application:
        name: GameHive
    threads:
        virtual:
            enabled: true
    mail:
        host: smtp.gmail.com
        port: 587
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    config:
        import: optional:file:./.env[.properties]
    jpa:
        properties:
          hibernate:
              default_batch_fetch_size: 20

server:
    compression:
        enabled: true
        mime-types: application/json,text/plain,text/css,text/javascript,application/javascript
        min-response-size: 2KB

springdoc:
    swagger-ui:
        path: /swagger-ui.html
        operations-sorter: alpha
        tags-sorter: alpha
        display-request-duration: true
    api-docs:
        path: /v3/api-docs

jwt:
    activation:
        secret: ${JWT_ACTIVATION_SECRET}
        validityInSeconds: 86400
    refresh:
        secret: ${JWT_REFRESH_SECRET}
        validityInSeconds: 604800
        maxActiveTokensPerUser: 5
    access:
        secret: ${JWT_ACCESS_SECRET}
        validityInSeconds: 900
    passwordreset:
        secret: ${JWT_PASSWORDRESET_SECRET}
        validityInSeconds: 900

management:
    endpoints:
        web:
            exposure:
                include: health
    endpoint:
        health:
            show-details: never
            probes:
                enabled: true
    health:
        mail:
            enabled: false

gamehive:
  moderation:
      max-resubmissions: 5
  search:
      enabled: true
      host: http://localhost:7700
      index-uid: gamehive_content
      taxonomy-index-uid: gamehive_taxonomy
      reindex-batch-size: 200
      reindex-lock-ttl: 15m
      task-wait-timeout: 60s
