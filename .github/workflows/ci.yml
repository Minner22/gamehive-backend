name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload Sonar input
        uses: actions/upload-artifact@v7
        with:
          name: sonar-input
          path: |
            target/classes/
            target/test-classes/
            target/site/jacoco/jacoco.xml
            target/surefire-reports/
          retention-days: 1

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu
          cache: maven

      - name: Flyway migrations on PostgreSQL (Testcontainers)
        run: ./mvnw -B -Pintegration test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-integration
          path: target/surefire-reports/
          retention-days: 7

  migrations-guard:
    name: migrations-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Block changes to existing Flyway migrations
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-status "origin/${BASE_REF}...HEAD" -- src/main/resources/db/migration \
            | awk '$1 != "A" { bad=1; print "::error file=" $NF "::Zmieniona istniejąca migracja (" $1 "): " $NF " - dodaj nowy plik V* zamiast edytować zastosowany" } END { exit bad }'

  sonar:
    name: sonar
    needs: test
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: zulu
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: sonar-${{ runner.os }}-

      - name: Download Sonar input
        uses: actions/download-artifact@v8
        with:
          name: sonar-input
          path: target/

      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -B sonar:sonar
